# Platform-stage device port of UniXNU to the Xiaomi Mi MIX 2S (polaris, SDM845).
# Read NOTES.md before attempting anything beyond the host checks. No bootable
# phone image exists for this port yet.

[board]
name = "polaris"
soc = "SDM845"
description = "Xiaomi Mi MIX 2S"
kit = "polaris"

[kernel]
defconfig = "polaris_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py PolarisBoardProbe",
  "build-arm-driver.py PolarisHardwareServices",
  "build-arm-driver.py PolarisPmicInput",
  "build-arm-driver.py PolarisPmicRuntime",
  "build-arm-driver.py PolarisSynapticsTouch",
  # Legacy 0090 GPIO33/34/S3330 transport; force-linked for explicit
  # polaris-touch-runtime=1 diagnostics only, disabled by default.
  "build-polaris-touch-runtime.py",
  "build-arm-driver.py PolarisTransportContracts",
  "build-arm-driver.py PolarisPeripheralContracts",
  "build-arm-driver.py PolarisNfcContract",
  "build-arm-driver.py PolarisCameraContract",
  "build-arm-driver.py PolarisA630Probe",
  "build-arm-driver.py PolarisDisplayContract",
  "build-arm-driver.py PolarisRuntime",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py ShengUfs",
  "build-arm-driver.py NativeMobileDisplay",
  "build-polaris-display.py",
  "build-native-legacy-display.py",
  "build-libpthread-kernel.py",
  "build-mockfs-fixture.py",
]

[payload]
volume = "POLARISESP"
size_mib = 96
loader = "firmware"
title = "polaris: UniXNU platform bring-up"
# Default describes the 6 GiB variant upper bank, safe on both installed sizes;
# the 8 GiB value 0xfcc00000 is selected with an explicit board override.
dram_size = "0x7cc00000"
panic_screen = false
# The services below are read-only resource/protocol probes.  They publish
# board facts during a temporary boot but do not map device registers, claim
# interrupts, load firmware, create DMA, or emit HID/network/camera events.
# Keep the real hardware backends separately gated until a phone run proves
# their transport and recovery paths.
kernel_args = ["-v", "serial=0", "debug=0x14e", "kt_fixed_zones=120", "cpus=1", "armcpu-self-ipi=1",
  "polaris-board-probe=1", "polaris-hw-probe=1", "polaris-pmic-input=1",
  "polaris-runtime=1", "polaris-rmi4-touch=1", "polaris-transport-probe=1", "polaris-peripheral-probe=1", "polaris-nfc-probe=1", "polaris-camera-probe=1", "polaris-a630-probe=1",
  "polaris-display-probe=1"]

[payload.adt]
tool = "scripts/make-polaris-adt.py"
owned_memory_size = "0x40000000"
cpu_regs = "0"
psci_method = "smc"
# APFS root volume inside the OS window of the SHNGROOT userdata image.
# Resolved from the 17.7.11 OS container: volume
# "DawnUpdate21H461.J120J121J207J208OS".
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[port]
stage = "platform"
hardware_tested = false
# The old ABL-shim chain (ios16_on_polaris_mix2s, XNU 8796) reached the iOS 16
# lock screen with touch. That evidence does not transfer to this Darwin 23
# tree: no firmware path, prelink target, userdata geometry or Apple identity
# has been qualified for this port, and the upstream full build is incomplete.

# The target OS image for the userland stage: the same iPad7,1 iPadOS 17.7.11
# restore image sheng is qualified against (the ABI the 4K source kernel
# prelinks to). iPhone X has no iOS 17, so the new chain carries an iPad
# identity, unlike the retired ABL chain.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# Provisional SHNGROOT userdata geometry for the 128 GB Polaris layout. The
# first LBA comes from the official MIUI rawprogram0.xml (0x60000000 bytes /
# 512); the size comes from the user's fastboot getvar output. Read the GPT
# back from the actual phone and update this table before any write.
[userdata]
first_lba = 0x300000
last_lba = 0xE52BFD7
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# First userland milestone: prelink the source kernel against the iPadOS 17
# kernelcache. The roots below are a deliberately small starting set (platform,
# crypto, AMFI, sandbox, APFS, storage/HID plumbing); expect iteration.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.kec.corecrypto",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.filesystems.apfs",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.security.sandbox",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.iokit.IOHIDFamily",
]
